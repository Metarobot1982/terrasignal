name: 앱 좌표 링크 조사
on:
  workflow_dispatch:
  push:
    paths: ['tools/probe_app.js']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i playwright@1.48.2 && npx playwright install chromium
      - run: node tools/probe_app.js || true
