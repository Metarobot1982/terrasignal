name: AI 해독 점검

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/ai_check.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode the two latest official articles (print only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd tools && python ai_check.py
