name: earth2.io 공식 뉴스 확인

on:
  schedule:
    - cron: '17 0,12 * * *'   # 하루 두 번 (한국 시간 09:17, 21:17)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/check_earth2_news.py
      - .github/workflows/earth2-news.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: earth2-news
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check earth2.io news
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/check_earth2_news.py
      - name: Save what was seen
        run: |
          git config user.name "terrasignal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inbox
          git diff --cached --quiet || (git commit -m "earth2.io 뉴스 확인 기록" && git push)
